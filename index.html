<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Pomodoro</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Pomodoro</h1>
        <section id="main">
            <div id="background"></div>
            <div id="timer">25:00</div>
            <section id="top">
                <button id="work" class="option" onclick="setWork()">Work (25 min)</button>
                <button id="short-break" class="option" onclick="setShortBreak()">Short Rest (5 min)</button>
                <button id="long-break" class="option" onclick="setLongBreak()">Long Rest (15 min)</button>
            </section>
            <section id="bottom">
                <div id="start-stop" onclick="start_stop()"></div>
                <button id="reset" onclick="reset()">Reset</button>
            </section>
        </section>
        
        <script src="script.js"></script>
    </body>
</html>
